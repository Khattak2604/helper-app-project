<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏪 Dukan Ledger — Shop Record Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">

    <!-- TOP HEADER -->
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-icon">🏪</span>
        <span class="brand-name">Dukan Ledger</span>
        <span class="brand-sub">Shop Record Manager</span>
      </div>
      <div class="topbar-center">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="globalSearch" class="search-input" placeholder="Search customers by name or phone..." />
        </div>
      </div>
      <div class="topbar-right">
        <span class="customer-count" id="customerCount">0 customers</span>
        <div class="status-pill" id="statusPill">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Connecting...</span>
        </div>
        <button class="btn-refresh" id="refreshBtn" title="Refresh">↺</button>
      </div>
    </header>

    <!-- MAIN SPLIT LAYOUT -->
    <div class="main-split">

      <!-- LEFT PANEL — Dashboard -->
      <div class="left-panel">
        <div class="panel-header">
          <h2 class="panel-title">👥 Customers</h2>
          <button class="btn-add-customer" id="addCustomerBtn">+ Add Customer</button>
        </div>

        <!-- Customer List -->
        <div class="customer-list" id="customerList">
          <div class="loading-state"><div class="spinner"></div><p>Loading...</p></div>
        </div>
      </div>

      <!-- RIGHT PANEL — Chatbot -->
      <div class="right-panel">
        <div class="chat-header">
          <div class="chat-header-left">
            <span class="chat-icon">🤖</span>
            <div>
              <div class="chat-title">AI Ledger Assistant</div>
              <div class="chat-subtitle">Roman Urdu &amp; English · Powered by Ollama</div>
            </div>
          </div>
          <div class="chat-header-actions">
            <button class="btn-lang-toggle" id="langToggle" title="Toggle language">EN</button>
            <button class="btn-clear-chat" id="clearChatBtn">⌫ Clear</button>
          </div>
        </div>

        <div class="chat-messages" id="chatMessages">
          <div class="chat-msg bot">
            <div class="msg-avatar">🤖</div>
            <div class="msg-bubble">
              <p>Assalam-o-Alaikum! Main aapka Dukan Ledger Assistant hoon. Try karo:</p>
              <div class="example-cmds">
                <button class="example-btn" onclick="fillChat(this)">Add customer Ali, phone 0321-1234567, Lahore</button>
                <button class="example-btn" onclick="fillChat(this)">Sab customers dikhao</button>
                <button class="example-btn" onclick="fillChat(this)">Ahmed ka aaj ka hisab add karo — atta 2 bag 1200 each</button>
                <button class="example-btn" onclick="fillChat(this)">Ahmed ka kul hisab kya hai</button>
                <button class="example-btn" onclick="fillChat(this)">Sara ka is mahine ka report banao</button>
              </div>
            </div>
          </div>
        </div>

        <div class="chat-input-area">
          <textarea id="chatInput" class="chat-textarea" placeholder="Type command... ya Roman Urdu mein bolain 🎙️" rows="1"></textarea>
          <button id="micBtn" class="mic-btn" title="Voice input">🎙️</button>
          <div class="voice-indicator" id="voiceIndicator">
            <span class="voice-pulse"></span>
            <span>Recording...</span>
          </div>
          <button id="sendBtn" class="send-btn">Send ↵</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Customer Detail Modal -->
  <div class="modal-overlay" id="customerDetailOverlay">
    <div class="modal modal-large">
      <div class="modal-header">
        <div>
          <h3 id="detailCustomerName">Customer Name</h3>
          <p class="modal-subtitle" id="detailCustomerMeta"></p>
        </div>
        <div class="modal-header-actions">
          <button class="btn-generate-report" id="generateReportBtn">📊 Monthly Report</button>
          <button class="modal-close" id="customerDetailClose">✕</button>
        </div>
      </div>
      <div class="modal-body" id="customerDetailBody">
        <!-- Daily records table rendered here -->
      </div>
      <div class="modal-footer">
        <div class="overall-total" id="overallTotalBadge"></div>
        <button class="btn-cancel" id="closeDetailBtn">Close</button>
      </div>
    </div>
  </div>

  <!-- Add Customer Modal -->
  <div class="modal-overlay" id="addCustomerOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3>➕ Add New Customer</h3>
        <button class="modal-close" id="addCustomerClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="newCustomerName" class="form-input" placeholder="e.g. Ahmed Khan" />
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="text" id="newCustomerPhone" class="form-input" placeholder="e.g. 0321-1234567" />
        </div>
        <div class="form-group">
          <label class="form-label">Address / Notes (Extra Info)</label>
          <input type="text" id="newCustomerExtra" class="form-input" placeholder="e.g. Nowshera, KPK" />
        </div>
        <div id="addCustomerResult" class="form-result"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="cancelAddCustomer">Cancel</button>
        <button class="btn-save" id="saveNewCustomer">✦ Add Customer</button>
      </div>
    </div>
  </div>

  <!-- Monthly Report Modal -->
  <div class="modal-overlay" id="reportOverlay">
    <div class="modal modal-large">
      <div class="modal-header">
        <div>
          <h3>📊 Monthly Report</h3>
          <p class="modal-subtitle" id="reportSubtitle"></p>
        </div>
        <div class="modal-header-actions">
          <button class="btn-download" id="downloadReportBtn">⬇ Download TXT</button>
          <button class="modal-close" id="reportClose">✕</button>
        </div>
      </div>
      <div class="modal-body" id="reportBody"></div>
      <div class="modal-footer">
        <div class="report-total" id="reportTotalBadge"></div>
        <button class="btn-cancel" id="closeReportBtn">Close</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
